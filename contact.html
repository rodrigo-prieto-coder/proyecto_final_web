    <meta charset="UTF-8">

<body>
    <header>
        <h1>Ponte en contacto</h1>
        <nav>
            <a href="index.html">Inicio</a> | 
            <a href="degree.html">Mi Grado</a> | 
            <a href="about.html">Sobre mí</a> | 
            <a href="topic.html">Consolas</a> | 
            <a href="contact.html">Contacto</a>
        </nav>
    </header>

    <div class="contenedor">
        <h2>Formulario de contacto</h2>
        <p>Si tienes alguna duda sobre mi grado o sobre la evolución de las consolas, puedes escribirme aquí:</p>

        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre aquí..." required>
            </p>
            <p>
                <label for="email">Correo electrónico:</label><br>
                <input type="email" id="email" name="email" placeholder="usuario@ejemplo.com" required>
            </p>
            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" style="width: 100%;" placeholder="Escribe tu mensaje..."></textarea>
            </p>
            <p>
                <button type="submit">Enviar datos</button>
            </p>
        </form>
    </div>

    <footer>
        <p>Rodrigo Prieto - 2025</p>
    </footer>
</body>
</html>
